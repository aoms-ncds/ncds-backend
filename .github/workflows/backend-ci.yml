    #     REGISTRY: $--{{ steps.login-ecr.outputs.registry }}
    #     REPOSITORY: $--{{ env.ECR_REPOSITORY }}
    #     IMAGE_TAG: latest # $--- Remove this hyphens if you want to use versioning instead of "latest" ----{{ steps.increment-git-tag.outputs.git-tag }}
